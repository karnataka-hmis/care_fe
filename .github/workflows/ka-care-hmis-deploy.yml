name: Build and deploy CARE FE to GCS for Karnataka HMIS

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  issues: write

jobs:
  # Step 1: Build the application
  build:
    runs-on: ubuntu-latest
    environment: Build
    outputs:
      build-artifact-id: ${{ steps.upload-artifact.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install
        
      - name: Build the React app
        run: npm run build
        
      - name: Upload build artifact
        id: upload-artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build/
          retention-days: 1

  # Step 2: Deploy to GCS and Invalidate CDN
  deploy-and-invalidate:
    runs-on: ubuntu-latest
    environment: Production
    needs: build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: build/
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Upload build to GCS
        run: |
          gsutil -m rsync -r -d build/ gs://${{ secrets.GCS_BUCKET_NAME }}/
      
      - name: Invalidate Cloud CDN cache
        run: |
          gcloud compute url-maps invalidate-cdn-cache ${{ secrets.CDN_URL_MAP_NAME }} \
            --path "/*" \
            --project=${{ secrets.GCP_PROJECT_ID }}

  # Step 3: Notify deployment status
  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy-and-invalidate]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.deploy-and-invalidate.result }}" == "success" ]; then
            echo "✅ Deployment completed successfully"
            echo "DEPLOYMENT_STATUS=success" >> $GITHUB_ENV
          else
            echo "❌ Deployment failed"
            echo "DEPLOYMENT_STATUS=failure" >> $GITHUB_ENV
            exit 1
          fi
          
      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy & CDN Invalidation | ${{ needs.deploy-and-invalidate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** Production" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
